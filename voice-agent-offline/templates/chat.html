<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alexa — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a25;
            --border: #1e1e2e;
            --text: #e4e4ed;
            --text-dim: #8888a0;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.15);
            --user-bg: #1a1a30;
            --bot-bg: #16161f;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --terminal: #22d3ee;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        .header {
            padding: 16px 20px;
            background: linear-gradient(180deg, var(--surface) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-status {
            font-size: 11px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Messages ───────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.5;
            animation: fadeIn 0.2s ease-out;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.terminal {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            background: #0d1117;
            border: 1px solid #21262d;
            color: var(--terminal);
        }

        .message.action {
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: var(--success);
        }

        .message.error {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--error);
        }

        .message.confirm {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: var(--warning);
        }

        /* ── Typing indicator ───────────────────────────── */
        .typing {
            align-self: flex-start;
            padding: 12px 20px;
            background: var(--bot-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: none;
        }

        .typing.visible { display: flex; gap: 5px; }

        .typing span {
            width: 7px;
            height: 7px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ── Quick Actions ──────────────────────────────── */
        .quick-actions {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .quick-actions::-webkit-scrollbar { display: none; }

        .quick-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .quick-btn:hover, .quick-btn:active {
            background: var(--surface-hover);
            color: var(--text);
            border-color: var(--accent);
        }

        /* ── Input ──────────────────────────────────────── */
        .input-area {
            padding: 12px 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 18px;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 40px;
            line-height: 1.4;
            transition: border-color 0.15s;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s, opacity 0.15s;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Confirm buttons ────────────────────────────── */
        .confirm-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .confirm-actions button {
            padding: 6px 16px;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-confirm {
            background: var(--error);
            color: #fff;
        }

        .btn-cancel {
            background: var(--surface);
            color: var(--text-dim);
            border: 1px solid var(--border) !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">⚡</div>
        <div>
            <div class="header-title">Alexa</div>
            <div class="header-status">
                <span class="status-dot"></span>
                Online — Local
            </div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">Hey boss. I'm running on your laptop right now. What do you need?</div>
    </div>

    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>

    <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('look at my screen')">👁 Screen</button>
        <button class="quick-btn" onclick="sendQuick('what apps are open')">🪟 Windows</button>
        <button class="quick-btn" onclick="sendQuick('find all PDFs in my documents')">📂 Find PDFs</button>
        <button class="quick-btn" onclick="sendQuick('pause')">⏸ Pause</button>
        <button class="quick-btn" onclick="sendQuick('volume 50')">🔊 Vol 50</button>
        <button class="quick-btn" onclick="sendQuick('how much disk space do I have')">💾 Disk</button>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Message Alexa..." rows="1" autofocus></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
    </div>

    <script>
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const typing = document.getElementById('typing');
        const sendBtn = document.getElementById('sendBtn');
        
        let pendingCommand = null;

        // Auto-resize textarea
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // Enter to send (Shift+Enter for newline)
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addConfirmMessage(text, command) {
            const div = document.createElement('div');
            div.className = 'message confirm';
            div.textContent = text;
            
            const actions = document.createElement('div');
            actions.className = 'confirm-actions';
            
            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'btn-confirm';
            confirmBtn.textContent = '🗑 Execute';
            confirmBtn.onclick = () => confirmCommand(command, actions);
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                actions.remove();
                addMessage('Cancelled.', 'bot');
                pendingCommand = null;
            };
            
            actions.appendChild(confirmBtn);
            actions.appendChild(cancelBtn);
            div.appendChild(actions);
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function confirmCommand(command, actionsEl) {
            actionsEl.remove();
            typing.classList.add('visible');
            
            try {
                const res = await fetch('/confirm', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command})
                });
                const data = await res.json();
                typing.classList.remove('visible');
                addMessage(data.response, data.type || 'terminal');
            } catch (err) {
                typing.classList.remove('visible');
                addMessage('Connection error.', 'error');
            }
            pendingCommand = null;
        }

        function sendQuick(text) {
            input.value = text;
            send();
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;
            typing.classList.add('visible');
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                
                const data = await res.json();
                typing.classList.remove('visible');
                
                if (data.type === 'confirm' && data.pending_command) {
                    addConfirmMessage(data.response, data.pending_command);
                    pendingCommand = data.pending_command;
                } else {
                    const msgClass = data.type === 'terminal' ? 'terminal' :
                                     data.type === 'action' ? 'action' :
                                     data.type === 'error' ? 'error' :
                                     data.type === 'vision' ? 'bot' : 'bot';
                    addMessage(data.response, msgClass);
                }
            } catch (err) {
                typing.classList.remove('visible');
                addMessage('Connection error. Is the server running?', 'error');
            }
            
            sendBtn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
